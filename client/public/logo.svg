<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%" fill="none">
  <!-- Pulse Hospital & I.C.U Official Logo (Matching 1.jpeg) -->
  <defs>
    <!-- Olive Forest Green for the medical cross vertical arms -->
    <linearGradient id="pulseGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d7532"/>
      <stop offset="100%" stop-color="#2d5c26"/>
    </linearGradient>

    <!-- Deep Teal Pine for the dynamic pulse wave ribbon -->
    <linearGradient id="pulseTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e494d"/>
      <stop offset="100%" stop-color="#072e33"/>
    </linearGradient>

    <!-- Filter for crisp subtle depth -->
    <filter id="cleanDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Cross + Wave) centered at x=60, y=60 -->
  <g transform="translate(10, 8)" filter="url(#cleanDrop)">
    <!-- Top Vertical Arm (Olive Green) -->
    <path d="M 43 14 C 43 7.5 48.5 2 55 2 L 65 2 C 71.5 2 77 7.5 77 14 L 77 40 C 72 45 62 47 52 46 C 47 45.5 44 44 43 42 Z" 
          fill="url(#pulseGreenGrad)"/>

    <!-- Bottom Vertical Arm (Olive Green) -->
    <path d="M 43 66 C 48 64 56 63 68 65 C 74 66 76 70 77 74 L 77 90 C 77 96.5 71.5 102 65 102 L 55 102 C 48.5 102 43 96.5 43 90 Z" 
          fill="url(#pulseGreenGrad)"/>

    <!-- Left Horizontal Arm (Olive Green Base) -->
    <path d="M 14 43 C 7.5 43 2 48.5 2 55 L 2 61 C 2 67.5 7.5 73 14 73 L 42 73 C 41 65 41 53 43 43 Z" 
          fill="url(#pulseGreenGrad)"/>

    <!-- White Separation Contour Mask / Glow -->
    <path d="M 2 59 C 22 55 36 67 52 70 C 72 73 88 56 106 45 C 114 40 120 45 118 52 C 104 68 85 85 64 83 C 44 81 28 69 4 71 Z"
          fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

    <!-- Dynamic Wave / Swoosh Ribbon (Deep Teal Navy) -->
    <path d="M 2 58 C 22 53 36 66 52 69 C 71 72 87 56 106 44 C 113.5 39.5 120 44 117.5 51 C 103.5 67 85 84 64 82 C 44 80 28 68 3 70 Z" 
          fill="url(#pulseTealGrad)"/>
          
    <!-- Subtle Pulse Wave Highlight on the ribbon -->
    <path d="M 18 61 C 34 62 48 70 63 71 C 78 72 93 60 108 48" 
          stroke="#42c2b3" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.35" fill="none"/>
  </g>

  <!-- LOGO TEXT: PULSE HOSPITAL & I.C.U / CARING FOR LIFE -->
  <g transform="translate(145, 12)">
    <!-- Main Title: PULSE HOSPITAL -->
    <text x="0" y="44" 
          font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-size="27" 
          font-weight="900" 
          letter-spacing="0.01em" 
          fill="#093437">
      PULSE HOSPITAL
    </text>

    <!-- Sub-heading: & I.C.U -->
    <text x="238" y="44" 
          font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-size="24" 
          font-weight="800" 
          letter-spacing="0.02em" 
          fill="#386e2e">
      &amp; I.C.U
    </text>

    <!-- Tagline: CARING FOR LIFE -->
    <text x="2" y="70" 
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-size="12" 
          font-weight="800" 
          letter-spacing="0.22em" 
          fill="#2b5e28">
      CARING FOR LIFE
    </text>

    <!-- Decorative Accent Line -->
    <line x1="168" y1="66" x2="310" y2="66" stroke="#386e2e" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  </g>
</svg>
