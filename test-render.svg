<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" fill="none">
  <defs>
    <!-- Soft shadow under the upper crest onto the white ribbon -->
    <filter id="waveShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1.5" dy="2" stdDeviation="2.5" flood-color="#041217" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#f8faf9"/>

  <!-- ==================== 1. BASE SOLID CROSS ==================== -->
  <!-- Top-Left (Olive Green: #6c8c27) -->
  <path d="M 100 10 A 27 27 0 0 0 73 37 L 73 100 L 100 100 Z" fill="#6c8c27" />
  
  <!-- Top-Right (Dark Forest Green: #0b3d34) -->
  <path d="M 100 10 A 27 27 0 0 1 127 37 L 127 100 L 100 100 Z" fill="#0b3d34" />
  
  <!-- Bottom-Left (Dark Forest Green: #0b3d34) -->
  <path d="M 73 100 L 73 163 A 27 27 0 0 0 100 190 L 100 100 Z" fill="#0b3d34" />

  <!-- Bottom-Right (Olive Green: #6c8c27) -->
  <path d="M 100 100 L 100 190 A 27 27 0 0 0 127 163 L 127 100 Z" fill="#6c8c27" />

  <!-- Left Horizontal Arm Base (Forest Green: #0e5844) -->
  <path d="M 73 73 L 37 73 A 27 27 0 0 0 10 100 A 27 27 0 0 0 37 127 L 73 127 Z" fill="#0e5844" />

  <!-- Right Horizontal Arm Base (Forest Green: #0e5844) -->
  <path d="M 127 73 L 163 73 A 27 27 0 0 1 190 100 A 27 27 0 0 1 163 127 L 127 127 Z" fill="#0e5844" />

  <!-- ==================== 2. LOWER-LEFT WAVE (Midnight Navy: #09222c) ==================== -->
  <!-- Covers the bottom half of the left arm, dips to (70, 134) and sweeps to center -->
  <path d="M 10 100 A 27 27 0 0 0 37 127 C 48 132 58 136 71 133 C 83 124 93 110 101 95 C 73 105 48 114 28 106 C 18 103 10 100 10 100 Z" 
        fill="#09222c" />

  <!-- ==================== 3. WHITE S-CURVE LIFELINE RIBBON ==================== -->
  <!-- Sweeps smoothly from lower-left crook (71, 133) through center to upper-right crook (129, 67) -->
  <path d="M 71 133 C 84 125 96 110 106 94 C 116 78 123 70 129 67 C 121 72 113 86 101 102 C 91 116 83 125 71 133 Z" 
        fill="#ffffff" />

  <!-- ==================== 4. UPPER-RIGHT WAVE (Midnight Navy: #09222c with shadow) ==================== -->
  <!-- Covers upper half of right arm, arches over top from (129, 67) to right tip (190, 100) -->
  <path d="M 106 94 C 116 78 123 70 129 67 C 139 63 151 67 163 73 A 27 27 0 0 1 190 100 C 172 106 152 114 127 106 C 116 103 108 103 101 102 C 103 99 104 96 106 94 Z" 
        fill="#09222c" filter="url(#waveShadow)" />
</svg>
