<head>
  <meta charset="UTF-8" />

  <script>document.documentElement.classList.add('js')</script>
  <!-- Title, description, robots, canonical, share tags and structured data
         for each page are written here by vite.config.js / scripts/prerender.mjs -->
  <!--seo-->
  <meta name="theme-color" content="#093437" />
  <meta name="format-detection" content="telephone=yes" />
  <meta name="geo.region" content="IN-GJ" />
  <meta name="geo.placename" content="Modasa, Arvalli" />

  <!-- Security & Modern Web Standards -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="google-site-verification" content="GSC_PULSE_HOSPITAL_VERIFICATION_TOKEN" />

  <!-- Google Analytics 4 & Consent Mode v2 Integration Hook -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      'analytics_storage': 'denied',
      'ad_storage': 'denied'
    });
    try {
      var consentStr = localStorage.getItem('pulse_cookie_consent_v1');
      if (consentStr && JSON.parse(consentStr).analytics) {
        gtag('consent', 'update', { 'analytics_storage': 'granted' });
      }
    } catch (e) {}
    window.addEventListener('pulse-cookie-consent-updated', function(e) {
      if (e.detail && e.detail.analytics) {
        gtag('consent', 'update', { 'analytics_storage': 'granted' });
      } else {
        gtag('consent', 'update', { 'analytics_storage': 'denied' });
      }
    });
  </script>

  <link rel="icon" href="/favicon.ico" sizes="any" />

  <!-- Fonts: Outfit (headings), Plus Jakarta Sans (body), Noto Sans / Anek Gujarati.
         Gujarati files only download when Gujarati text is on screen (unicode-range). -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Loaded without blocking the first paint; system fonts show until they arrive -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
